<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Glamtopia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "glam-ink": "#464858",
            "glam-rose": "#0F3040",
            "glam-gold": "#0A222E",
            "glam-blush": "#FFFFFF",
            "glam-sage": "#464858",
            "glam-cloud": "#D99B7F",
            "glam-nav": "#D99B7F",
            "glam-warn": "#A56F63",
            "glam-peach": "#D99B7F"
          },
          fontFamily: {
            display: ["Fraunces", "serif"],
            sans: ["Manrope", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="min-h-screen flex flex-col">

  <header class="border-b border-black/5 bg-glam-nav shadow-sm sticky top-0 z-40">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

      <a href="index.html" class="font-display text-xl sm:text-2xl font-semibold text-glam-ink">
        Glamtopia
      </a>

      <a href="browse.html" class="text-sm font-semibold hover:text-glam-rose">
        Browse without an account →
      </a>

    </nav>
  </header>


  <main class="flex-1 flex items-center justify-center px-6 py-16">

    <div class="glam-card w-full max-w-md p-8">

      <p class="glam-eyebrow mb-2">
        Welcome back
      </p>

      <h1 class="font-display text-3xl text-glam-ink mb-6">
        Log in to Glamtopia
      </h1>


      <div id="next-banner"
        class="hidden text-sm bg-glam-blush border border-glam-gold/30 rounded-lg px-4 py-3 mb-6 text-glam-ink/80">
        Log in to finish booking your appointment.
      </div>


      <form id="login-form" class="space-y-4" novalidate>

        <div>

          <label for="email" class="text-sm font-semibold block mb-1">
            Email
          </label>

          <input id="email" name="email" type="email" required
            class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />

        </div>


        <div>

          <label for="password" class="text-sm font-semibold block mb-1">
            Password
          </label>

          <input id="password" name="password" type="password" required
            class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />

        </div>


        <p id="form-error" class="hidden text-sm text-glam-warn" role="alert"></p>


        <button type="submit" id="login-button" class="glam-btn-primary w-full font-semibold px-6 py-3 rounded-full">
          Log in
        </button>

      </form>


      <p class="text-sm text-glam-ink/60 mt-6 text-center">

        New to Glamtopia?

        <a href="register.html" class="text-glam-rose font-semibold hover:underline">
          Create an account
        </a>

      </p>

    </div>

  </main>


  <footer class="border-t border-black/5 bg-glam-nav">

    <div class="max-w-6xl mx-auto px-6 py-10 text-sm text-glam-ink/60">

      © 2026 Glamtopia. Beauty services in Peshawar.

    </div>

  </footer>


  <script>

    // ==========================================
    // API BASE URL
    // ==========================================

    const API_BASE = "http://localhost:5000";


    // ==========================================
    // BOOKING BANNER
    // ==========================================

    if (
      new URLSearchParams(window.location.search).get("next") === "booking"
    ) {

      document
        .getElementById("next-banner")
        .classList
        .remove("hidden");

    }


    // ==========================================
    // LOGIN
    // ==========================================

    const loginForm =
      document.getElementById("login-form");

    const errorEl =
      document.getElementById("form-error");

    const loginButton =
      document.getElementById("login-button");


    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      // Clear old error

      errorEl.classList.add("hidden");
      errorEl.textContent = "";


      // ==========================================
      // VALIDATION
      // ==========================================

      if (!email || !password) {

        errorEl.textContent =
          "Enter both an email and a password to continue.";

        errorEl.classList.remove("hidden");

        return;
      }


      // ==========================================
      // DISABLE BUTTON
      // ==========================================

      loginButton.disabled = true;

      loginButton.textContent =
        "Logging in...";


      try {

        // ==========================================
        // LOGIN API
        // ==========================================

        const response = await fetch(
          `${API_BASE}/api/auth/login`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data =
          await response.json();


        // ==========================================
        // LOGIN FAILED
        // ==========================================

        if (!response.ok) {

          errorEl.textContent =
            data.message || "Login failed.";

          errorEl.classList.remove("hidden");

          loginButton.disabled = false;

          loginButton.textContent =
            "Log in";

          return;
        }


        // ==========================================
        // LOGIN SUCCESS
        // ==========================================

        console.log(
          "Glamtopia login successful:",
          data
        );

        // If this login was triggered by clicking "Book" while logged out
        // (see booking-flow.html's checkAuth), returnTo carries them right
        // back to the exact booking they were trying to make — a customer
        // account only, since a provider account has no business finishing
        // someone else's booking flow.
        const returnTo = new URLSearchParams(window.location.search).get("returnTo");
        if (
          returnTo &&
          returnTo.startsWith("/booking-flow.html") && // only allow this exact known-safe relative path — never an arbitrary/external redirect target
          data.user &&
          data.user.role === "customer"
        ) {
          // URLSearchParams.get() already decodes the value once — no need
          // to decodeURIComponent again here.
          window.location.href = returnTo;
          return;
        }

        // Provider → check whether they've already set up a profile.
        // Previously this always sent providers back to the setup FORM on
        // every login, forever — even someone who registered and filled it
        // out weeks ago. Now: profile exists -> dashboard, first time only
        // (no profile yet, 404) -> the setup form.

        if (
          data.user &&
          data.user.role === "provider"
        ) {

          try {
            const profileCheck = await fetch(
              `${API_BASE}/api/providers/me`,
              { credentials: "include" }
            );

            window.location.href = profileCheck.ok
              ? "client/provider-dashboard.html"
              : "client/profile-provider.html";
          } catch (profileCheckError) {
            // If this check itself fails (e.g. network hiccup), fall back
            // to the setup form — it's the safer default of the two, since
            // profile-provider.html itself pre-fills and just re-saves if
            // a profile already exists, whereas landing on the dashboard
            // with no profile leads to broken empty-state everywhere.
            console.error("Provider profile check failed:", profileCheckError);
            window.location.href = "client/profile-provider.html";
          }

          return;
        }


        // Customer → Customer Dashboard

        window.location.href =
          "customer-dashboard.html";


      } catch (error) {

        console.error(
          "Login connection error:",
          error
        );


        errorEl.textContent =
          "Server connection error. Please make sure Glamtopia backend is running on port 5000.";

        errorEl.classList.remove("hidden");


        loginButton.disabled = false;

        loginButton.textContent =
          "Log in";

      }

    });

  </script>


  <script src="js/nav.js"></script>

</body>

</html>
