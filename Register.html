<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Glamtopia</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "glam-ink": "#33402A", "glam-rose": "#9DAD86", "glam-gold": "#89986D",
          "glam-blush": "#F6F0D8", "glam-sage": "#6F8F52", "glam-cloud": "#FFFDF4",
          "glam-nav": "#C6DA9F", "glam-warn": "#B0623F"
        },
        fontFamily: { display: ["Fraunces", "serif"], sans: ["Manrope", "sans-serif"] }
      }
    }
  };
</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

<header class="border-b border-black/5 bg-glam-nav shadow-sm sticky top-0 z-40">
  <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="font-display text-xl sm:text-2xl font-semibold text-glam-ink">Glamtopia</a>
    <a href="browse.html" class="text-sm font-semibold hover:text-glam-rose">Browse without an account →</a>
  </nav>
</header>

<main class="flex-1 flex items-center justify-center px-6 py-16">
  <div class="glam-card w-full max-w-md p-8">
    <p class="glam-eyebrow mb-2">Join Glamtopia</p>
    <h1 class="font-display text-3xl text-glam-ink mb-6">Create your account</h1>

    <!-- Role select — SRS FR-01: role is set at signup, not changeable after -->
    <div class="flex gap-2 mb-6" role="group" aria-label="Choose account type">
      <button type="button" data-role="customer" class="role-btn glam-chip flex-1 px-4 py-2.5 rounded-full text-sm font-semibold" aria-pressed="true">
        I'm a customer
      </button>
      <button type="button" data-role="provider" class="role-btn glam-chip flex-1 px-4 py-2.5 rounded-full text-sm font-semibold" aria-pressed="false">
        I'm a provider
      </button>
    </div>

    <form id="register-form" class="space-y-4" novalidate>
      <div>
        <label for="name" class="text-sm font-semibold block mb-1">Full name</label>
        <input id="name" name="name" type="text" required
          class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />
      </div>
      <div>
        <label for="email" class="text-sm font-semibold block mb-1">Email</label>
        <input id="email" name="email" type="email" required
          class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />
      </div>
      <div id="phone-field">
        <label for="phone" class="text-sm font-semibold block mb-1">
          Phone number <span class="text-glam-ink/40 font-normal">(required for customers, FR-11)</span>
        </label>
        <input id="phone" name="phone" type="tel"
          class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />
      </div>
      <div>
        <label for="password" class="text-sm font-semibold block mb-1">Password</label>
        <input id="password" name="password" type="password" required
          class="w-full border border-black/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none" />
      </div>
      <p id="form-error" class="hidden text-sm text-glam-warn" role="alert"></p>
      <button type="submit" class="glam-btn-primary w-full font-semibold px-6 py-3 rounded-full">Create account</button>
    </form>

    <p class="text-sm text-glam-ink/60 mt-6 text-center">
      Already have an account? <a href="login.html" class="text-glam-rose font-semibold hover:underline">Log in</a>
    </p>
  </div>
</main>

<footer class="border-t border-black/5 bg-glam-nav">
  <div class="max-w-6xl mx-auto px-6 py-10 text-sm text-glam-ink/60">
    © 2026 Glamtopia. Beauty services in Peshawar.
  </div>
</footer>

<script>
  const roleButtons = document.querySelectorAll(".role-btn");
  const phoneField = document.getElementById("phone-field");
  const phoneInput = document.getElementById("phone");

  roleButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      roleButtons.forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");

      const isCustomer = btn.dataset.role === "customer";
      phoneField.classList.toggle("hidden", !isCustomer);
      phoneInput.required = isCustomer; // required for customers per FR-11, optional at signup for providers
    });
  });
</script>

<script>
  const API_BASE = "http://localhost:5000/api"; // change this to your deployed backend URL later

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("form-error");
    errorEl.classList.add("hidden");

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const phone = document.getElementById("phone").value.trim();

    // Which role is selected — read from the toggle buttons above
    const selectedRoleBtn = document.querySelector('.role-btn[aria-pressed="true"]');
    const role = selectedRoleBtn ? selectedRoleBtn.dataset.role : "customer";

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    // --- Client-side validation (fast feedback, not the real security layer) ---
    if (!name || !email || !password) {
      showError("Fill in your name, email, and password to continue.");
      return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      showError("Please enter a valid email address.");
      return;
    }

    if (password.length < 6) {
      showError("Password must be at least 6 characters.");
      return;
    }

    const phonePattern = /^[0-9+\-\s()]{7,20}$/;
    if (role === "customer" && !phone) {
      showError("Phone number is required for customer accounts.");
      return;
    }
    if (phone && !phonePattern.test(phone)) {
      showError("Phone number can only contain digits, spaces, +, -, and parentheses.");
      return;
    }

    // --- Send to the real backend ---
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include", // required so the session cookie gets set
        body: JSON.stringify({ name, email, password, role, phone_number: phone || undefined }),
      });

      const data = await res.json();

      if (!res.ok) {
        // Show whatever the backend actually rejected it for (e.g. "Email already registered")
        showError(data.message || "Something went wrong. Please try again.");
        return;
      }

      // Success — session cookie is now set, redirect based on role
      window.location.href = role === "provider" ? "provider-dashboard.html" : "index.html";
    } catch (err) {
      console.error(err);
      showError("Could not reach the server. Is it running?");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
<script src="js/nav.js"></script>
</body>
</html>
