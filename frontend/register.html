<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ZiriumAI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Provider Account</h1>

    <form id="registerForm">

        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <label>Role</label>

        <select id="role" required>

            <option value="provider">
                Provider
            </option>

            <option value="customer">
                Customer
            </option>

        </select>


        <button type="submit">
            Register
        </button>

    </form>


    <div id="message"></div>

</div>


<script>

const registerForm =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const role =
            document.getElementById("role").value;


        try {

            const response =
                await fetch(
                    "/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email,
                            password,
                            role
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Registration failed";

                return;
            }


            message.textContent =
                "Registration successful!";


            setTimeout(() => {

                window.location.href =
                    "/login.html";

            }, 1000);


        } catch (error) {

            console.log(error);

            message.textContent =
                "Server connection error";
        }

    }
);
</script>
</body>
</html>
