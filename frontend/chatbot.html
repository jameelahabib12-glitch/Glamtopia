<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glamtopia Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f9, #f4f6ff);
            min-height: 100vh;
        }

        /* Main Chatbot */

        .chat-wrapper {
            width: 95%;
            max-width: 430px;
            height: 650px;
            margin: 35px auto;
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);

            display: flex;
            flex-direction: column;
        }

        /* Header */

        .chat-header {
            background: linear-gradient(135deg, #d63384, #8e44ad);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            color: #d63384;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
        }

        .header-text h2 {
            margin: 0;
            font-size: 19px;
        }

        .header-text p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Chat Area */

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        /* Welcome Message */

        .welcome {
            text-align: center;
            margin: 20px 0;
        }

        .welcome-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .welcome h3 {
            margin: 5px 0;
            color: #333;
        }

        .welcome p {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Messages */

        .message-row {
            display: flex;
            margin-bottom: 14px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot {
            background: #ffffff;
            color: #333;
            border: 1px solid #eee;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: linear-gradient(135deg, #d63384, #8e44ad);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Typing */

        .typing {
            display: none;
            background: white;
            border: 1px solid #eee;
            padding: 10px 14px;
            width: fit-content;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        .typing span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #d63384;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* Input Area */

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;

            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 12px 17px;
            font-size: 14px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #d63384;
        }

        #sendBtn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;

            background: linear-gradient(135deg, #d63384, #8e44ad);
            color: white;

            font-size: 18px;
            cursor: pointer;

            transition: 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .chat-wrapper {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }

        }
    </style>
</head>

<body>

    <div class="chat-wrapper">

        <!-- Header -->

        <div class="chat-header">

            <div class="bot-avatar">
                🤖
            </div>

            <div class="header-text">

                <h2>Glamtopia Assistant</h2>

                <p>
                    Your beauty services assistant
                </p>

            </div>

        </div>


        <!-- Chat -->

        <div id="chatBox" class="chat-box">

            <div class="welcome">

                <div class="welcome-icon">
                    💗
                </div>

                <h3>Welcome to Glamtopia!</h3>

                <p>
                    I'm here to help you with beauty services,
                    providers, bookings, profiles and reviews.
                </p>

            </div>


            <!-- Typing -->

            <div id="typing" class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask me anything about Glamtopia..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
                type="button"
                title="Send message"
            >
                ➤
            </button>

        </div>

    </div>


    <script src="chatbot.js"></script>

</body>

</html>
