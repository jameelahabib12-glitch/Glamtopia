<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .photo-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        .photo-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #6c757d;
            text-align: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .save-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .hint {
            font-size: 13px;
            color: #6c757d;
            font-weight: normal;
            margin-top: -2px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Your Profile</h1>

        <form id="customerProfileForm">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="bio">Bio</label>
            <textarea
                id="bio"
                placeholder="A short note about yourself..."
            ></textarea>

            <label for="photo">Profile Photo</label>
            <div class="photo-row">
                <div class="photo-preview" id="photoPreview">No photo</div>
                <input type="file" id="photo" accept="image/*">
            </div>

            <button type="submit" class="save-btn">Save Profile</button>

        </form>

        <div id="message"></div>

    </div>

    <script src="profile-customer.js"></script>

</body>
</html>
