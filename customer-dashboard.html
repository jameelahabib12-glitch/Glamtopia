<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — Glamtopia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // NOTE: this config was missing entirely before — bg-glamCream,
    // text-glamOlive, etc. below were resolving to nothing, so this page
    // was rendering completely unstyled. Same token set as
    // client/provider-dashboard.html, so the two dashboards stay visually
    // consistent.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            glamCream: '#FFFFFF',
            glamLightSage: '#D99B7F',
            glamSage: '#464858',
            glamOlive: '#0F3040',
            glamPeach: '#D99B7F',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* .glass-card-opaque was used below but never defined anywhere this
       page could see it — also fixed here, matching provider-dashboard.html.
       Peach surface, navy text — same direction as the marketing pages. */
    .glass-card-opaque {
      background: #D99B7F;
      border: 1px solid rgba(15, 48, 64, 0.12);
      box-shadow: 0 2px 10px rgba(15, 48, 64, 0.08);
    }
  </style>
</head>

<body class="bg-glamCream text-glamOlive font-sans min-h-screen">

  <div id="authGate" class="min-h-screen flex items-center justify-center px-6">
    <p class="text-sm text-glamOlive/60">Checking your session…</p>
  </div>

  <div id="dashboard" class="hidden max-w-5xl mx-auto px-6 py-10">
    <header class="flex justify-between items-center mb-10">
      <div class="flex items-center gap-4">
        <div id="avatarContainer"
          class="w-14 h-14 rounded-full bg-glamLightSage/40 border border-glamSage/30 flex items-center justify-center text-glamOlive font-bold text-lg overflow-hidden shrink-0">
          <span id="avatarInitial">—</span>
        </div>
        <div>
          <p class="text-sm text-glamOlive/60">Welcome back,</p>
          <h1 id="customerName" class="text-2xl font-bold" style="font-family:'Fraunces',serif;">—</h1>
        </div>
      </div>
      <button id="logoutBtn"
        class="text-xs font-bold uppercase tracking-wider px-4 py-2 rounded-xl border border-glamSage/40 hover:bg-glamSage/10 transition-all">
        Log out
      </button>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
      <a href="browse.html"
        class="glass-card-opaque rounded-2xl p-5 border border-glamSage/20 hover:border-glamSage/50 transition-all">
        <p class="text-sm font-bold text-glamOlive">Browse Providers</p>
        <p class="text-xs text-glamOlive/60 mt-1">Find a service to book</p>
      </a>
      <a href="client/profile-customer.html"
        class="glass-card-opaque rounded-2xl p-5 border border-glamSage/20 hover:border-glamSage/50 transition-all">
        <p class="text-sm font-bold text-glamOlive">Profile Settings</p>
        <p class="text-xs text-glamOlive/60 mt-1">Update your details</p>
      </a>
      <div class="glass-card-opaque rounded-2xl p-5 border border-glamSage/20">
        <p class="text-sm font-bold text-glamOlive">Upcoming</p>
        <p id="upcomingCount" class="text-xs text-glamOlive/60 mt-1">—</p>
      </div>
    </div>

    <div class="glass-card-opaque rounded-2xl shadow-xl p-6 border border-glamSage/20">
      <h2 class="text-lg font-bold text-glamOlive mb-4">My Bookings</h2>
      <div id="bookingsContainer" class="space-y-3">
        <p class="text-xs text-glamOlive/60 italic">Loading your bookings…</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";

    async function init() {
      try {
        const res = await fetch(`${API_BASE}/auth/me`, { credentials: "include" });
        if (!res.ok) {
          window.location.href = "login.html";
          return;
        }
        const data = await res.json();

        if (data.user.role !== "customer") {
          // A provider landing here by mistake — send them to their own dashboard instead
          window.location.href = "client/provider-dashboard.html";
          return;
        }

        document.getElementById("customerName").textContent = data.user.name;
        document.getElementById("avatarInitial").textContent = data.user.name.charAt(0).toUpperCase();
        document.getElementById("authGate").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

        loadAvatar();
        loadBookings();
      } catch (err) {
        console.error("Session check failed:", err);
        window.location.href = "login.html";
      }
    }

    // Separate call because /api/auth/me is intentionally minimal (id/name/
    // email/role only) — the photo lives on the fuller /api/profile response,
    // the same endpoint the profile edit page saves through.
    async function loadAvatar() {
      try {
        const res = await fetch(`${API_BASE}/profile`, { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        if (data.user && data.user.photo) {
          document.getElementById("avatarContainer").innerHTML =
            `<img src="http://localhost:5000${data.user.photo}" alt="Your profile photo" class="w-full h-full object-cover">`;
        }
      } catch (err) {
        console.error("Failed to load avatar:", err);
      }
    }

    async function loadBookings() {
      const container = document.getElementById("bookingsContainer");
      try {
        const res = await fetch(`${API_BASE}/bookings/mine`, { credentials: "include" });
        if (!res.ok) throw new Error("Request failed");
        const bookings = await res.json();

        const upcoming = bookings.filter(b => ["pending", "confirmed"].includes(b.status));
        document.getElementById("upcomingCount").textContent =
          upcoming.length === 1 ? "1 booking" : `${upcoming.length} bookings`;

        if (!bookings.length) {
          container.innerHTML = `<p class="text-xs text-glamOlive/60 italic">No bookings yet — browse providers to make your first one.</p>`;
          return;
        }

        container.innerHTML = bookings.map(renderBookingRow).join("");
      } catch (err) {
        console.error("Failed to load bookings:", err);
        container.innerHTML = `<p class="text-xs text-red-600">Couldn't load your bookings. Try refreshing.</p>`;
      }
    }

    // SRS §8: customers can only cancel at least 24h before the appointment
    // — this mirrors the same rule the server enforces (bookingController's
    // cancelBooking), so the button is disabled up front instead of the
    // customer tapping Cancel and only THEN finding out it's too late.
    const CANCEL_CUTOFF_HOURS = 24;

    function renderBookingRow(b) {
      const canCancel = ["pending", "confirmed"].includes(b.status);
      const startTime = b.slot_id ? new Date(b.slot_id.start_time) : null;
      const hoursUntil = startTime ? (startTime - new Date()) / (1000 * 60 * 60) : null;
      const tooLateToCancel = hoursUntil !== null && hoursUntil < CANCEL_CUTOFF_HOURS;

      let action = "";
      if (canCancel) {
        if (tooLateToCancel) {
          action = `<span class="text-[10px] text-glamOlive/50 italic whitespace-nowrap">Too close to cancel</span>`;
        } else {
          action = `<button data-cancel-booking="${b._id}" class="text-[10px] font-bold uppercase text-red-600 hover:underline whitespace-nowrap">Cancel</button>`;
        }
      }

      return `
        <div class="flex justify-between items-center p-3 bg-glamCream/70 border border-glamSage/30 rounded-xl gap-3">
          <div class="min-w-0">
            <p class="text-sm font-bold text-glamOlive">${b.service_id?.name || "Service"}</p>
            <p class="text-xs text-glamOlive/60">${b.provider_id?.business_name || "Provider"} · ${startTime ? startTime.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""
        }</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-[10px] font-bold uppercase px-2 py-1 rounded-full bg-glamSage/20">${b.status}</span>
            ${action}
          </div>
        </div>
      `;
    }

    document.getElementById("bookingsContainer").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-cancel-booking]");
      if (!btn) return;

      if (!confirm("Cancel this booking? This cannot be undone.")) return;

      try {
        const res = await fetch(`${API_BASE}/bookings/${btn.dataset.cancelBooking}/cancel`, {
          method: "PATCH",
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          alert(data.message || "Could not cancel this booking.");
          return;
        }
        loadBookings();
      } catch (err) {
        console.error("Cancel booking failed:", err);
        alert("Could not reach the server.");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch(`${API_BASE}/auth/logout`, { method: "POST", credentials: "include" });
      window.location.href = "index.html";
    });

    init();
  </script>
  <script src="js/nav.js"></script>
</body>

</html>
