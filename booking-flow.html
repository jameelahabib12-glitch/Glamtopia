<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your booking — Glamtopia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "glam-ink": "#464858",
                        "glam-rose": "#0F3040",
                        "glam-gold": "#0A222E",
                        "glam-blush": "#FFFFFF",
                        "glam-sage": "#464858",
                        "glam-cloud": "#D99B7F",
                        "glam-nav": "#D99B7F",
                        "glam-warn": "#A56F63",
                        "glam-peach": "#D99B7F"
                    },
                    fontFamily: { display: ["Fraunces", "serif"], sans: ["Manrope", "sans-serif"] }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<!--
  REFERENCE BOOKING FLOW — for Alishba (Week 2: "Booking flow UI (slot picker
  → confirm) wired to Jameela's booking endpoint").

  This is a working, self-contained page — not a mockup — so it's a drop-in
  starting point rather than a spec to re-derive. Feel free to reshape it to
  match provider.html's layout, or lift the loadSlots()/confirmBooking()
  functions straight into provider.js once real (non-mock) provider data is
  wired in.

  HOW IT'S ENTERED:
  Expects ?providerId=<provider_profiles._id>&serviceId=<services._id> in the
  URL. On provider.html, that means each service's "Book" button (currently
  in js/provider.js -> bindBookingButtons()) should link here instead of
  straight to login, e.g.:
    booking-flow.html?providerId=${p._id}&serviceId=${s._id}
  Guests still get bounced to login FIRST per FR-13 — see checkAuth() below,
  which mirrors the same login.html?next=booking pattern already used
  elsewhere, then returns them straight back to this same URL after login.

  WHAT IT DOES:
  1. Auth check — guests get redirected to log in, then sent right back here.
  2. Loads the chosen service (GET /api/services/:id).
  3. Loads the provider's open slots (GET /api/availability/:providerId) and
     renders them as pickable chips.
  4. On confirm, POSTs to /api/bookings — the real endpoint, including the
     atomic double-booking guard. A 409 here means someone else grabbed the
     slot a moment earlier; the UI refreshes the slot list and asks the
     customer to pick again rather than showing a generic error.
-->

<body class="min-h-screen flex flex-col">

    <header class="border-b border-black/5 bg-glam-nav shadow-sm sticky top-0 z-40">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="font-display text-xl sm:text-2xl font-semibold text-glam-ink">Glamtopia</a>
            <span id="navUser" class="text-sm text-glam-ink/70"></span>
        </nav>
    </header>

    <main class="flex-1 max-w-2xl mx-auto px-6 py-10 w-full">
        <a id="backLink" href="browse.html" class="text-sm font-semibold text-glam-rose hover:underline">&larr; Back to
            profile</a>

        <div id="flowRoot" class="mt-6">
            <p class="text-glam-ink/60 text-sm italic">Loading…</p>
        </div>
    </main>

    <footer class="border-t border-black/5 bg-glam-nav">
        <div class="max-w-6xl mx-auto px-6 py-10 text-sm text-glam-ink/60">
            © 2026 Glamtopia. Beauty services in Peshawar.
        </div>
    </footer>

    <script>
        const API_BASE = "http://localhost:5000/api";
        const params = new URLSearchParams(window.location.search);
        const providerId = params.get("providerId");
        const serviceId = params.get("serviceId");

        let selectedSlot = null; // the full slot object, not just its id — we need start_time to render the confirm step

        const root = document.getElementById("flowRoot");

        document.getElementById("backLink").href = providerId
            ? `provider.html?id=${providerId}`
            : "browse.html";

        init();

        async function init() {
            if (!providerId || !serviceId) {
                root.innerHTML = errorBlock("This booking link is missing information — go back and pick a service again.");
                return;
            }

            const user = await checkAuth();
            if (!user) return; // checkAuth already redirected to login

            document.getElementById("navUser").textContent = `Booking as ${user.name}`;

            try {
                const [service, slots] = await Promise.all([loadService(), loadSlots()]);
                renderSlotPicker(service, slots);
            } catch (err) {
                console.error(err);
                root.innerHTML = errorBlock("Couldn't load this provider's services or availability. Try again in a moment.");
            }
        }

        // FR-13: guests are only pushed to log in at the point of booking, then
        // returned straight back here (not to a generic dashboard) after login.
        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`, { credentials: "include" });
                if (!res.ok) {
                    const returnTo = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = `login.html?next=booking&returnTo=${returnTo}`;
                    return null;
                }
                const data = await res.json();
                if (data.user.role !== "customer") {
                    root.innerHTML = errorBlock("Only customer accounts can book appointments. Log in with a customer account to continue.");
                    return null;
                }
                return data.user;
            } catch (err) {
                root.innerHTML = errorBlock(`Couldn't reach the server. Is it running on ${API_BASE}?`);
                return null;
            }
        }

        async function loadService() {
            const res = await fetch(`${API_BASE}/services/${serviceId}`, { credentials: "include" });
            if (!res.ok) throw new Error("Service not found");
            return res.json();
        }

        async function loadSlots() {
            const res = await fetch(`${API_BASE}/availability/${providerId}`, { credentials: "include" });
            if (!res.ok) throw new Error("Could not load availability");
            return res.json();
        }

        // ---- Step 1: slot picker ----
        function renderSlotPicker(service, slots) {
            selectedSlot = null;

            root.innerHTML = `
        <div class="glam-card p-6">
          <p class="glam-eyebrow mb-2">Book an appointment</p>
          <h1 class="font-display text-2xl text-glam-ink mb-1">${service.name}</h1>
          <p class="text-sm text-glam-ink/60 mb-1">${service.duration_minutes} min · PKR ${service.price.toLocaleString()}</p>
          <p class="text-sm text-glam-ink/70 mb-6">${service.description}</p>

          <h2 class="font-display text-lg text-glam-ink mb-3">Choose a time</h2>
          <div id="slotGrid" class="flex flex-wrap gap-3 mb-2"></div>
          <p id="slotEmptyNote" class="text-xs text-glam-ink/50 hidden">
            No open slots right now — check back soon or try another provider.
          </p>

          <div class="flex justify-end mt-6">
            <button id="continueBtn" disabled
              class="glam-btn-primary font-semibold px-6 py-3 rounded-full opacity-40 cursor-not-allowed">
              Continue
            </button>
          </div>
        </div>
      `;

            const grid = document.getElementById("slotGrid");
            if (!slots.length) {
                document.getElementById("slotEmptyNote").classList.remove("hidden");
            } else {
                grid.innerHTML = slots.map(slotChip).join("");
                grid.querySelectorAll("[data-slot-id]").forEach((chip) => {
                    chip.addEventListener("click", () => selectSlot(chip, slots));
                });
            }

            document.getElementById("continueBtn").addEventListener("click", () => {
                if (selectedSlot) renderConfirmStep(service, selectedSlot);
            });
        }

        function slotChip(slot) {
            const start = new Date(slot.start_time);
            const label = start.toLocaleString(undefined, {
                weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
            });
            return `<button type="button" data-slot-id="${slot._id}" class="glam-chip px-4 py-2 rounded-full text-sm">${label}</button>`;
        }

        function selectSlot(chipEl, slots) {
            document.querySelectorAll("[data-slot-id]").forEach((c) => c.removeAttribute("aria-pressed"));
            chipEl.setAttribute("aria-pressed", "true");
            selectedSlot = slots.find((s) => s._id === chipEl.dataset.slotId);

            const btn = document.getElementById("continueBtn");
            btn.disabled = false;
            btn.classList.remove("opacity-40", "cursor-not-allowed");
        }

        // ---- Step 2: confirm ----
        function renderConfirmStep(service, slot) {
            const start = new Date(slot.start_time);
            const dateLabel = start.toLocaleString(undefined, {
                weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit",
            });

            root.innerHTML = `
        <div class="glam-card p-6">
          <p class="glam-eyebrow mb-2">Confirm your booking</p>
          <h1 class="font-display text-2xl text-glam-ink mb-4">${service.name}</h1>

          <dl class="space-y-2 text-sm mb-6">
            <div class="flex justify-between"><dt class="text-glam-ink/60">Date & time</dt><dd class="font-semibold">${dateLabel}</dd></div>
            <div class="flex justify-between"><dt class="text-glam-ink/60">Duration</dt><dd class="font-semibold">${service.duration_minutes} min</dd></div>
            <div class="flex justify-between"><dt class="text-glam-ink/60">Price</dt><dd class="font-semibold">PKR ${service.price.toLocaleString()}</dd></div>
          </dl>

          <p class="text-xs text-glam-ink/50 mb-6">
            "Pay at Appointment" — no payment is taken now. This request goes to the
            provider as <strong>pending</strong> until they confirm it.
          </p>

          <p id="confirmError" class="hidden text-sm font-semibold text-glam-warn mb-4"></p>

          <div class="flex justify-between items-center">
            <button id="backToSlotsBtn" class="glam-btn-outline font-semibold px-5 py-3 rounded-full">Choose a different time</button>
            <button id="confirmBtn" class="glam-btn-primary font-semibold px-6 py-3 rounded-full">Confirm booking</button>
          </div>
        </div>
      `;

            document.getElementById("backToSlotsBtn").addEventListener("click", async () => {
                renderSlotPicker(service, await loadSlots());
            });

            document.getElementById("confirmBtn").addEventListener("click", (e) => confirmBooking(e.target, service, slot));
        }

        async function confirmBooking(btn, service, slot) {
            const errorEl = document.getElementById("confirmError");
            errorEl.classList.add("hidden");
            btn.disabled = true;
            btn.textContent = "Booking…";

            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ serviceId: service._id, slotId: slot._id }),
                });

                const data = await res.json().catch(() => ({}));

                if (res.status === 409) {
                    // Someone else claimed this exact slot a moment earlier — this is
                    // the double-booking guard working as intended, not a bug.
                    errorEl.textContent = data.message || "That slot was just taken. Pick another time below.";
                    errorEl.classList.remove("hidden");
                    renderSlotPicker(service, await loadSlots());
                    return;
                }

                if (!res.ok) {
                    errorEl.textContent = data.message || "Something went wrong — please try again.";
                    errorEl.classList.remove("hidden");
                    btn.disabled = false;
                    btn.textContent = "Confirm booking";
                    return;
                }

                renderSuccessStep(service, slot);
            } catch (err) {
                console.error(err);
                errorEl.textContent = "Couldn't reach the server. Please try again.";
                errorEl.classList.remove("hidden");
                btn.disabled = false;
                btn.textContent = "Confirm booking";
            }
        }

        // ---- Step 3: success ----
        function renderSuccessStep(service, slot) {
            const start = new Date(slot.start_time);
            const dateLabel = start.toLocaleString(undefined, {
                weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit",
            });

            root.innerHTML = `
        <div class="glam-card p-8 text-center">
          <p class="glam-status-available font-display text-2xl mb-2">Request sent!</p>
          <p class="text-glam-ink/70 mb-6">
            Your booking for <strong>${service.name}</strong> on <strong>${dateLabel}</strong>
            is now <strong>pending</strong>. You'll see it move to confirmed once the provider accepts it.
          </p>
          <a href="browse.html" class="glam-btn-primary inline-block font-semibold px-6 py-3 rounded-full">Browse more providers</a>
        </div>
      `;
            // NOTE for Alishba: once a "My Bookings" customer dashboard page
            // exists, link there instead of back to browse.html.
        }

        function errorBlock(message) {
            return `
        <div class="glam-card p-6 text-center">
          <p class="glam-status-full font-semibold mb-2">Something's not right</p>
          <p class="text-sm text-glam-ink/70">${message}</p>
        </div>
      `;
        }
    </script>
</body>

</html>
